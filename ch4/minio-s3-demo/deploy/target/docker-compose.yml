# 目标 Milvus standalone + etcd，对象存储 = 外部 AWS S3（无本地 MinIO）。
# proxy 映射到 localhost:19531，可与源环境(19530)并存。etcd 独立卷 -> 干净元数据。
name: milvus-dst
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.17
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
    volumes:
      - ./volumes/milvus:/var/lib/milvus
      # S3 配置在此 —— 由 render-user-yaml.sh 从 env.sh 生成
      - ./user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "19531:19530"   # proxy（宿主 19531 避免与源冲突）
      - "9092:9091"     # metrics
    depends_on:
      - etcd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
