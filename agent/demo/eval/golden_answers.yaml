q001:
  question: "我们 S3 文档同步流程是怎么设计的？"
  golden_answer: >
    S3 文档同步流程包括 bucket scanning、change detection、document parsing、
    chunking、embedding generation，以及 Milvus insertion。
  required_facts:
    - "bucket scanning"
    - "change detection"
    - "document parsing"
    - "chunking"
    - "embedding generation"
    - "Milvus insertion"
  required_citations:
    - "doc_s3_sync_design_c003"
    - "doc_rag_arch_v1_p003_c002"

q002:
  question: "RAG 架构里 Milvus 负责哪一层？"
  golden_answer: >
    Milvus 负责向量与混合检索层，存储 text_vector、sparse_vector 和可选 image_vector，
    并支持 metadata filter、order by 和 aggregation。
  required_facts:
    - "hybrid retrieval"
    - "text vector"
    - "sparse vector"
    - "metadata filter"
    - "order by"
  required_citations:
    - "doc_milvus_feature_map_c001"

