q009:
  question: "S3 文档同步的机制原理是什么？"
  golden_answer: >
    同步机制先扫描 bucket 并检测变更对象，再解析文档、切块、生成 embedding，
    最后写入 Milvus；step-back 的架构背景不能单独回答这个具体机制问题。
  required_facts:
    - "chunking"
    - "embedding"
  required_citations:
    - "doc_s3_sync_design_c003"
    - "doc_rag_arch_v1_p003_c002"

q010:
  question: "段位是怎么定义的？"
  golden_answer: >
    “段位”在 game 与 hr 两个 domain 下含义不同，无法消歧，应在检索前请求澄清。
  required_facts:
  required_citations:

q011:
  question: "介绍下 Milvus 3.0 Force Merge"
  golden_answer: >
    Force Merge 让运维显式合并符合条件的 segment，影响存储布局与查询效率，
    而不是新增应用层检索能力。
  required_facts:
    - "Force Merge"
    - "segments"
  required_citations:
    - "doc_milvus_feature_map_c002"

q012:
  question: "Milvus 3.0 有哪些特性？"
  golden_answer: >
    Milvus 3.0 的特性覆盖 Force Merge 的 segment 合并，以及向量与混合检索层的
    text_vector/sparse_vector/image_vector 存储与 metadata filter。
  required_facts:
    - "Force Merge"
    - "sparse_vector"
  required_citations:
    - "doc_milvus_feature_map_c001"
    - "doc_milvus_feature_map_c002"

