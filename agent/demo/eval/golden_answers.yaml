q014:
  question: "RAG 架构里 Milvus 负责哪一层？"
  golden_answer: >
    同 session 内重复的等价问题命中 grounded response cache，
    保留原 citations，且不调用 search tools、reranker 或 answer generator。
  required_facts:
  required_citations:
    - "doc_milvus_feature_map_c001"

q015:
  question: "你还记得我的偏好吗？"
  golden_answer: >
    显式 recall 只从同 session 的 Memory 回答，不产生 KB citation，也不选择检索工具。
  required_facts:
  required_citations:

q016:
  question: "RAG 架构里 Milvus 负责哪一层？"
  golden_answer: >
    主 reranker 不可用时，配置好的 wrapper 降级到确定性 rule reranker 并记录
    registered fallback reason，golden path 仍然产出通过 citation 自检的答案。
  required_facts:
    - "hybrid retrieval"
  required_citations:
    - "doc_milvus_feature_map_c001"
